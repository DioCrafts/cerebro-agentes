# Alternativa a Caddy: nginx como proxy inverso con TLS (certificados de certbot). Ejemplo
# (docs/despliegue.md). La API escucha en 127.0.0.1:8000 (systemd/hacienda-api.service).
server {
    listen 80;
    server_name hacienda.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name hacienda.example.org;

    ssl_certificate     /etc/letsencrypt/live/hacienda.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hacienda.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Por encima de API_MAX_BODY_BYTES (32 MB): la API da su propio 413 con un mensaje.
    client_max_body_size 40m;

    # La API, bajo /api/ (la barra final de proxy_pass quita el prefijo).
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # La respuesta del agente llega en streaming (application/x-ndjson).
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # La interfaz compilada (frontend/dist).
    root /srv/hacienda-asesor/frontend/dist;
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri /index.html; }
}
