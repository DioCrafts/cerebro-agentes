# HaciendaGPT con Docker Compose: api + worker + web (interfaz estática y proxy inverso con TLS).
# Ejemplo (docs/despliegue.md). Desde la raíz del repositorio:
#
#   cp docs/despliegue/entorno.ejemplo docs/despliegue/.env    # y rellénalo (secretos: nunca al repositorio)
#   docker compose -f docs/despliegue/docker-compose.yml --env-file docs/despliegue/.env up -d --build
#
# api y worker comparten el volumen «datos»: la base de datos SQLite (modo WAL) necesita que los dos
# procesos estén en la MISMA máquina y en un disco local (nunca NFS/SMB).
name: haciendagpt

x-backend: &backend
  build:
    context: ../..
    dockerfile: docs/despliegue/Dockerfile
  image: haciendagpt-backend
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    TZ: Europe/Madrid
    AUTH_MODE: ${AUTH_MODE:-required}
  volumes:
    - datos:/srv/hacienda-asesor/data

services:
  api:
    <<: *backend
    environment:
      TZ: Europe/Madrid
      AUTH_MODE: ${AUTH_MODE:-required}
      # El worker reparte los eventos; la API solo los escribe.
      EVENTOS_DESPACHO_EN_API: "false"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    <<: *backend
    command: ["python", "-m", "asistente.plataforma.cli.plataforma", "worker"]
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-m", "asistente.plataforma.cli.plataforma", "salud", "--exigir-worker"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    stop_grace_period: 60s

  web:
    build:
      context: ../..
      dockerfile: docs/despliegue/Dockerfile.web
    image: haciendagpt-web
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_datos:/data
      - caddy_config:/config
    depends_on:
      - api

  # --- Canal SimpleX Chat (opcional; docs/mensajeria/simplex.md) ----------------------------------------------------
  # Solo con el perfil «simplex»:  docker compose --profile simplex -f ... --env-file ... up -d --build
  # (en .env: MENSAJERIA_ACTIVA=true y SIMPLEX_SHA256=<suma del binario>; SIMPLEX_RELEASE para otra versión).
  # La CLI comparte el espacio de red del worker (network_mode): su API WebSocket, SIN autenticación, solo existe en el
  # 127.0.0.1 de ese espacio. No le pongas «ports» ni «expose». Si el worker se recrea, reinicia también «simplex».
  # Su salida se descarta (escribe en ella el texto de cada mensaje que envía el bot).
  simplex-preparar:
    profiles: ["simplex"]
    image: haciendagpt-backend
    command: ["python", "-c", "import os; os.makedirs('/srv/hacienda-asesor/data/mensajeria/simplex/archivos/recepcion', 0o700, exist_ok=True)"]
    volumes:
      - datos:/srv/hacienda-asesor/data
    restart: "no"

  simplex:
    profiles: ["simplex"]
    build:
      context: ../..
      dockerfile: docs/despliegue/Dockerfile.simplex
      args:
        SIMPLEX_RELEASE: ${SIMPLEX_RELEASE:-v7.1.4}
        SIMPLEX_ASSET: ${SIMPLEX_ASSET:-simplex-chat-ubuntu-22_04-x86_64}
        SIMPLEX_SHA256: ${SIMPLEX_SHA256:-}
    image: haciendagpt-simplex
    restart: unless-stopped
    network_mode: "service:worker"
    depends_on:
      worker:
        condition: service_started
      simplex-preparar:
        condition: service_completed_successfully
    volumes:
      # The CLI's database (the bot's keys): back it up.
      - simplex_datos:/var/lib/simplex-chat
      # Only the incoming-files staging folder of the shared data volume, at the path the worker uses.
      - type: volume
        source: datos
        target: /srv/hacienda-asesor/data/mensajeria/simplex/archivos/recepcion
        volume:
          subpath: mensajeria/simplex/archivos/recepcion
    logging:
      driver: "none"
    stop_grace_period: 30s

volumes:
  datos:
  caddy_datos:
  caddy_config:
  simplex_datos:
