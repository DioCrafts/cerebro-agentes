<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Installable app (PWA): manifest, colours, iOS home screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#10141a" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HaciendaGPT" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>HaciendaGPT — Asesor fiscal con fuentes verificadas</title>
    <meta name="description" content="Asesor fiscal para España: responde con la normativa aplicable y verifica cada afirmación contra su fuente." />
    <script>
      // Apply the saved (or OS) theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("haciendagpt_theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
