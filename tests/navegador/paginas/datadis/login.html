<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Datadis · Acceso (simulación local)</title>
<link rel="stylesheet" href="{{TRACKER}}/estilos.css"></head>
<body>
<header><h1>Datadis</h1><p>Plataforma de datos de consumo de las distribuidoras (SIMULACIÓN LOCAL PARA PRUEBAS)</p></header>
<main>
  <h2>Acceso de consumidores</h2>
  <form method="POST" action="/login" id="form-login">
    <label for="nif">NIF/NIE</label>
    <input id="nif" name="username" autocomplete="username">
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button type="submit" id="entrar">Entrar</button>
  </form>
  {{ERROR}}
</main>
</body>
</html>
