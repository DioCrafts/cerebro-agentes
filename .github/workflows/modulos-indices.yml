name: modulos-indices

# Twice a month (the Bank of Spain's reference rates are published in the BOE early in the month and
# around mid-month), the mortgage module reads the new resolutions from www.boe.es and adds them to its
# versioned series (asistente/ambitos/hipoteca/data/). Nothing is written to the repository: the
# updated series is uploaded as an artifact for a person to review and commit, like the parameters'
# readings. A red run means the resolutions could not be read cleanly (the log lists each problem).
#
# Needs network access to www.boe.es only (no LLM, no secrets).

on:
  schedule:
    - cron: "23 6 4,19 * *" # 4th and 19th of each month, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hipoteca-indices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - name: Read the new reference-rate resolutions from the BOE
        run: uv run python -m asistente.ambitos.hipoteca.indices actualizar
      - name: Show what changed
        if: always()
        run: git diff --stat -- asistente/ambitos/hipoteca/data/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: hipoteca-indices
          path: asistente/ambitos/hipoteca/data/
