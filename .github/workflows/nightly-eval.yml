name: nightly-eval

# Continuous evaluation that doesn't need a PR. Runs the real deterministic
# decision pipeline against the critical cases and the normative drift detector,
# so regressions and source drift surface even on quiet days.

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch:

# Least privilege for the GITHUB_TOKEN (docs/seguridad.md): these jobs only read the repository.
permissions:
  contents: read

jobs:
  critical-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - name: Critical regression (real deterministic pipeline)
        run: |
          uv run python -m asistente.plataforma.cli.check_critical_regressions \
            --dataset eval_data/critical_cases/tramite_year_critical_cases.jsonl \
            --min-intent-accuracy 0.80 \
            --min-fact-f1 0.75 \
            --max-unsafe-rate 0.05

  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync
      - name: Normative drift report
        # No crawler snapshot is committed, so sources resolve as
        # "unverified" rather than "changed"; the run still validates that every
        # rule's source_refs are well-formed and the governance pipeline
        # executes. On infra that has ./data populated, add --fail-on-changed to
        # turn this into a blocking gate before promoting a snapshot.
        run: |
          uv run python -m asistente.plataforma.cli.drift_check \
            --rules-dir rules \
            --snapshot-root ./data \
            --output reports/drift.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: drift-report
          path: reports/drift.json
