[project]
name = "asistente"
version = "0.1.0"
description = "Cerebro personal del hogar: agente con módulos especializados (fiscal, hipoteca, correo, navegador) que responde con fuentes citadas y verificables."
authors = [
    { name = "Aldo Borrero", email = "82811+aldoborrero@users.noreply.github.com" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "requests==2.34.2",
    # The project's one HTTP client (asistente/plataforma/http.py). requests stays only for
    # asistente/investigador/web.py until that module moves to it.
    "httpx==0.28.1",
    "openai==2.37.0",
    # The FAISS index on disk is LangChain's pickle format: langchain-community loads it and langchain-core
    # provides the Document type it stores. Both go when the index moves to sqlite-vec.
    "langchain-community==0.4.1",
    "langchain-core==1.4.0",
    # Ingestion + chunking: Docling (PDF/HTML layout- and table-aware parsing,
    # tokenization-aware HybridChunker) is the single ingestion backend, called
    # directly (DocumentConverter + HybridChunker).
    "docling==2.96.0",
    "faiss-cpu==1.13.2",
    # Corpus index in one SQLite file (vectors; BM25 is SQLite FTS5). Replaces faiss-cpu + rank-bm25 once validated.
    "sqlite-vec==0.1.9",
    "cryptography==48.0.0",
    "huggingface-hub==1.15.0",
    "tqdm==4.67.3",
    "click==8.4.0",
    "scrapy==2.15.2",
    "scrapy-fake-useragent==1.4.4",
    "pathvalidate==3.3.1",
    "scrapy-playwright==0.0.46",
    # Tokenizer for Docling's HybridChunker (loaded from the local converted
    # model dir via HF AutoTokenizer). The embedder itself runs on MLX, so we
    # don't need sentence-transformers / langchain-huggingface anywhere.
    "transformers>=4.51.0,<6.0.0",
    # MLX backend for Apple Silicon — bf16 weights, no quantization. The
    # project targets Apple Silicon Macs at runtime; this dep is non-optional
    # there. Pinned to the versions the conversion was verified against. The
    # ``sys_platform``/``platform_machine`` markers keep ``uv sync`` working on
    # Linux/x86 (CI, type-checking) where MLX has no wheels — those environments
    # run the test suite with the MLX paths stubbed (see tests/conftest.py),
    # never the real inference path.
    "mlx==0.31.2 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-embeddings==0.1.0 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Local LLM (reranker, contextualizer) on MLX; imported lazily.
    "mlx-lm>=0.28 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "fastapi==0.118.0",
    "uvicorn==0.37.0",
    "pydantic==2.13.5",
    "anthropic==2.8.0",
    # The browser agent (asistente/capacidades/navegador) drives Chromium through Playwright directly; it also comes
    # with scrapy-playwright, but the agent must not depend on that crawler dependency staying.
    "playwright>=1.48",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.8",
    "mypy==1.18.2",
    "time-machine>=2.16",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asistente"]

[tool.ruff]
line-length = 120
target-version = "py313"
fix = true

[tool.ruff.format]
# Sustituye a black. El ancho (120) se hereda de [tool.ruff]; aquí no admite line-length.
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
# E501: line length handled by ruff format. UP042: `class Foo(str, Enum)` is kept on
# purpose — migrating to StrEnum changes str(member) and would alter the
# pydantic/JSON serialization of the decision schemas.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# api.py: first-party imports deliberately come after the module-level setup.
"asistente/plataforma/api/api.py" = ["E402"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
no-lines-before = ["local-folder"]
known-first-party = ["asistente"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "lento: tarda más de unos segundos (modelos, índices, corpus); fuera de `make test-rapido`",
    "navegador: arranca Chromium con Playwright",
    "normativa: comprueba datos contra el texto de la norma (fixtures del BOE)",
    "en_vivo: sale a la red o a un proveedor real; nunca en la batería normal",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["^tests/"]

[tool.importlinter]
root_package = "asistente"

# Contrato inicial, en modo informe (`make imports`, no rompe `make quality`): las capas de arriba pueden importar
# las de abajo, nunca al revés. Hoy se incumple en muchos sitios (núcleo y conocimiento importan de plataforma y de
# los ámbitos); el informe es la lista de deudas que hay que ir pagando antes de volverlo obligatorio.
[[tool.importlinter.contracts]]
name = "Capas de asistente"
type = "layers"
layers = [
    "asistente.plataforma",
    "asistente.ambitos : asistente.capacidades : asistente.investigador",
    "asistente.nucleo : asistente.conocimiento",
]
